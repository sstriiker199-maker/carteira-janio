name: Sonda de APIs
on:
  push:
    branches: [main]
    paths: ['.github/sondas/apis/**', '.github/workflows/sonda-apis.yml']
  workflow_dispatch:
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Rodar
        shell: bash
        working-directory: .github/sondas/apis
        run: |
          bash sonda.sh 2>&1 | sed 's/^/EDGE| /'
          timeout 200 node sonda.js 2>&1 || true
