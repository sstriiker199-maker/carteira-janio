# Monta o instalador do Windows e publica em "Releases".
# Uma versão nova só sai quando o campo "version" do package.json muda
# (se a versão já existir publicada, o electron-builder não sobrescreve).
name: Publicar versão

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Limpar versão com envio incompleto
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if gh release view "v$V" >/dev/null 2>&1; then
            if ! gh release view "v$V" --json assets -q '.assets[].name' | grep -q '\.exe$'; then
              echo "Versão v$V sem instalador: apagando para enviar de novo"
              gh release delete "v$V" -y --cleanup-tag
            fi
          fi

      - name: Montar e publicar instalador
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx electron-builder --win --publish always 2>&1 | tee build.log || {
            echo "::error title=Falha no build::veja as linhas abaixo"
            grep -iE 'message|"code"|resource|field|uploading|url|publishing|errors|already|\\u' build.log | grep -v ratelimit | tail -n 40 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-400)
              [ -n "$clean" ] && echo "::error::$clean"
            done
            exit 1
          }
