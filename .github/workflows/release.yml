# Monta o instalador do Windows e publica em "Releases".
# Uma versão nova só sai quando o campo "version" do package.json muda.
name: Publicar versão

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Preparar versão
        id: prep
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          R="repos/$GITHUB_REPOSITORY/releases"
          # Se esta versão já foi publicada com instalador, não faz nada
          if gh api "$R?per_page=100" --jq ".[] | select(.draft == false and .tag_name == \"v$V\") | .assets[].name" | grep -q '\.exe$'; then
            echo "Versão v$V já publicada."
            echo "pular=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Apaga versões quebradas (sem .exe) e rascunhos desta versão
          gh api "$R?per_page=100" \
            --jq ".[] | select(((([.assets[].name | endswith(\".exe\")] | any) | not)) or (.draft and .tag_name == \"v$V\")) | .id" |
            while read -r id; do echo "Apagando $id"; gh api -X DELETE "$R/$id"; done
          git fetch --tags --force
          if ! git rev-parse "v$V" >/dev/null 2>&1; then
            git tag "v$V"
            git push origin "v$V"
          fi
          gh release create "v$V" --draft --title "v$V" --notes "Versão $V da Carteira Janio"

      - name: Instalar dependências
        if: steps.prep.outputs.pular != '1'
        shell: bash
        run: |
          npm install > npm.log 2>&1 || { grep -E 'npm (error|ERR)' npm.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Montar e enviar instalador
        if: steps.prep.outputs.pular != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx electron-builder --win --publish always 2>&1 | tee build.log || {
            echo "::error title=Falha no build::veja as linhas abaixo"
            grep -iE 'message|"code"|resource|field|uploading|url|publishing|errors|already' build.log | grep -v ratelimit | tail -n 40 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-400)
              [ -n "$clean" ] && echo "::error::$clean"
            done
            exit 1
          }

      - name: Publicar versão
        if: steps.prep.outputs.pular != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.prep.outputs.versao }}
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"v$V\") | .id" | head -1)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true --jq '.html_url'

      # Cópia dos instaladores no repositório público de atualizações
      # (permite deixar o código privado). Só roda se o segredo existir.
      - name: Copiar para o repositório de atualizações
        if: steps.prep.outputs.pular != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_ATUALIZACOES }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::Segredo TOKEN_ATUALIZACOES não configurado: instaladores ficam só neste repositório."; exit 0; fi
          V=${{ steps.prep.outputs.versao }}
          DEST=sstriiker199-maker/carteira-janio-atualizacoes
          ls dist
          gh release delete "v$V" -R "$DEST" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" -R "$DEST" --title "v$V" --notes "Versão $V do Wallet - Trabalho" --latest \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml
