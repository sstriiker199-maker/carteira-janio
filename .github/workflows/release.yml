# Monta o instalador do Windows e publica em "Releases".
# Uma versão nova só sai quando o campo "version" do package.json muda
# (se a versão já existir publicada, o electron-builder não sobrescreve).
name: Publicar versão

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Montar e publicar instalador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
