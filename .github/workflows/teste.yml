# Abre o app num computador do GitHub (sem tela) e registra os erros como avisos.
name: Teste de abertura

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  abrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Abrir o app
        shell: bash
        env:
          CARTEIRA_TESTE: '1'
        run: |
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          timeout 180 xvfb-run -a npx electron . --no-sandbox > saida.txt 2>&1 || true
          grep '^LOG' saida.txt | cut -c30-330 > logs.txt || true
          grep -iE 'error' saida.txt | grep -v '^LOG' | head -5 >> logs.txt || true
          split -l 8 logs.txt parte_
          for f in parte_*; do echo "::warning::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; done
          grep -q 'tela visível: tela-' saida.txt
