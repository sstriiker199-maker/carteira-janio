# Abre o app num computador do GitHub (sem tela) e registra os erros como avisos.
name: Teste de abertura

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  abrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sondar servidores
        shell: bash
        run: |
          bash .github/sondas/sondar.sh > sondas.txt 2>&1 || true
          split -l 6 sondas.txt sonda_
          for f in sonda_*; do echo "::notice::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; done
      - name: Instalar dependências
        shell: bash
        run: |
          npm install > npm.log 2>&1 || { grep -E 'npm (error|ERR)' npm.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          grep -E 'Ícones|Logo|Sem logo' npm.log | while IFS= read -r l; do echo "::notice::$l"; done
      - name: Abrir o app
        shell: bash
        env:
          CARTEIRA_TESTE: '1'
        run: |
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          timeout 300 xvfb-run -a -s "-screen 0 1600x1000x24" npx electron . --no-sandbox > saida.txt 2>&1 || true
          grep '^LOG' saida.txt | cut -c30-330 > logs.txt || true
          grep -iE 'error' saida.txt | grep -v '^LOG' | head -5 >> logs.txt || true
          split -l 25 logs.txt parte_
          for f in parte_*; do echo "::warning::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; done
          grep -q 'tela visível: tela-' saida.txt
      - name: Guardar fotos das telas (ramo "telas")
        if: always()
        shell: bash
        run: |
          [ -d telas ] || exit 0
          cd telas
          git init -q && git checkout -q -b telas
          git config user.name "teste" && git config user.email "teste@users.noreply.github.com"
          git add -A && git commit -qm "fotos $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY" telas
